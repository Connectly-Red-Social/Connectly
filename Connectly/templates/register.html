<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Connectly</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='output.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100 text-gray-800 font-[Poppins]">
    <div class="w-full min-h-screen flex flex-col lg:flex-row">
        <div class="hidden lg:flex w-full lg:w-1/2 min-h-screen bg-login relative items-center justify-center flex-col">
            <div class="absolute inset-0 bg-gradient-to-tr from-teal-400 via-blue-500 to-purple-600 opacity-70"></div>
            <div class="relative z-10 p-10 text-center text-white break-words">
                <h2 class="text-3xl font-extrabold mb-4">Conéctate con tus amigos</h2>
                <p class="text-lg mb-6">Únete a nuestra red y conecta con personas con intereses similares.</p>
                
                <div class="flex items-center justify-center space-x-3 mt-8">
                    <div class="flex -space-x-2">
                        <img src="{{ url_for('static', filename='images/user1.png') }}" alt="user1" class="w-10 h-10 rounded-full border-2 border-white">
                        <img src="{{ url_for('static', filename='images/user2.png') }}" alt="user2" class="w-10 h-10 rounded-full border-2 border-white">
                        <img src="{{ url_for('static', filename='images/user3.png') }}" alt="user3" class="w-10 h-10 rounded-full border-2 border-white">
                        <img src="{{ url_for('static', filename='images/user4.png') }}" alt="user4" class="w-10 h-10 rounded-full border-2 border-white">
                    </div>
                    <div class="text-lg text-white pl-3 border-l border-white">
                        <span class="font-bold">{{ user_count }}</span> usuarios registrados
                    </div>
                </div>
            </div>
        </div>

        <div class="w-full lg:w-1/2 min-h-screen flex items-center justify-center p-6 sm:p-12 bg-white">
            <div class="max-w-md w-full">
                <div class="flex flex-col sm:flex-row items-center justify-center mb-6 space-y-2 sm:space-y-0 sm:space-x-2">
                    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Connectly Logo" class="w-12 sm:w-16 h-12 sm:h-16">
                    <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 text-center sm:text-left">Connectly</h1>
                </div>
                

                <div class="text-center mb-6 break-words">
                    <h2 class="text-2xl sm:text-3xl lg:text-4xl font-extrabold text-gray-800">Crea tu cuenta</h2>
                    <p class="text-gray-500 mt-2">Completa tus datos para unirte a Connectly</p>
                </div>

                <form action="{{ url_for('register') }}" method="post" class="space-y-4">
                    <div>
                        <label for="name" class="block text-sm font-semibold text-gray-600">Nombre completo</label>
                        <input type="text" id="name" name="name" class="w-full mt-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent" placeholder="Tu nombre" required  value="{{ form.get('name', '') }}">
                    </div>
                    <div>
                        <label for="username" class="block text-sm font-semibold text-gray-600">Nombre de Usuario</label>
                        <input type="text" id="username" name="username" class="w-full mt-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent" placeholder="Elige un usuario" required minlength="3" maxlength="30" value="{{ form.get('username', '') }}">
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-semibold text-gray-600">Correo electrónico</label>
                        <input type="email" id="email" name="email" class="w-full mt-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent" placeholder="tu@correo.com" required  value="{{ form.get('email', '') }}">
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="gender" class="block text-sm font-semibold text-gray-600">Género</label>
                            <select id="gender" name="gender" class="w-full mt-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent" required>
                                <option value="" disabled {% if not form.get('gender') %}selected{% endif %}>Selecciona</option>
                                {% for g in genders %}<option value="{{ g }}" {% if form.get('gender') == g %}selected{% endif %}>{{ g }}</option>{% endfor %}
                            </select>
                        </div>
                        <div>
                            <label for="interest" class="block text-sm font-semibold text-gray-600">Interés principal</label>
                            <select id="interest" name="interest" class="w-full mt-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent" required>
                                <option value="" disabled {% if not form.get('interest') %}selected{% endif %}>Selecciona</option>
                                {% for i in interests %}<option value="{{ i }}" {% if form.get('interest') == i %}selected{% endif %}>{{ i }}</option>{% endfor %}
                            </select>
                        </div>
                    </div>
                    <div>
                        <label for="country" class="block text-sm font-semibold text-gray-600">País (opcional)</label>
                        <input type="text" id="country" name="country" class="w-full mt-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent" placeholder="Tu país"   value="{{ form.get('country', '') }}">
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-semibold text-gray-600">Contraseña</label>
                        <input type="password" id="password" name="password" class="w-full mt-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent" placeholder="Mínimo 8 caracteres" required minlength="8">
                    </div>
                    <div>
                        <label for="confirm_password" class="block text-sm font-semibold text-gray-600">Confirmar contraseña</label>
                        <input type="password" id="confirm_password" name="confirm_password" class="w-full mt-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent" placeholder="Repite tu contraseña" required >
                    </div>

                    <button type="submit" class="w-full py-3 bg-gradient-to-r from-blue-500 to-teal-500 text-white font-bold rounded-lg hover:from-teal-500 hover:to-blue-500 transition duration-300 ease-in-out">
                        Registrarse
                    </button>
                </form>

                {% if error %}
                    <p class="mt-4 text-center text-sm text-red-500 break-words">{{ error }}</p>
                {% endif %}

                <p class="mt-8 text-center text-gray-600 text-sm">
                    ¿Ya tienes una cuenta?
                    <a href="{{ url_for('login') }}" class="text-blue-500 font-medium hover:underline">Inicia sesión</a>
                </p>
            </div>
    </div>
</body>
</html>
