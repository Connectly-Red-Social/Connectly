<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Panel{% endblock %} · Administración Connectly</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='output.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>
<body class="bg-gray-100 font-[Poppins]">
    <nav class="bg-gradient-to-r from-blue-500 to-teal-500 shadow-lg">
        <div class="container mx-auto px-4 py-4 flex flex-wrap gap-3 justify-between items-center">
            <a href="{{ url_for('admin_dashboard') }}" class="flex items-center space-x-4">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" class="h-10 w-10 rounded-full">
                <h1 class="text-white text-xl sm:text-2xl font-bold">Panel de Administración</h1>
            </a>
            <div class="flex items-center gap-5 text-white font-medium">
                {% if request.endpoint != 'admin_dashboard' %}<a href="{{ url_for('admin_dashboard') }}" class="hover:underline">Panel</a>{% endif %}
                <a href="{{ url_for('logout') }}" class="hover:underline">Cerrar sesión</a>
            </div>
        </div>
    </nav>
    <div id="toast-root" class="fixed top-4 right-4 z-[60] flex flex-col gap-2 w-[calc(100%-2rem)] max-w-sm pointer-events-none"></div>
    <main class="container mx-auto p-4 sm:p-6">{% block content %}{% endblock %}</main>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
